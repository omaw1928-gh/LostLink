# ─────────────────────────────────────────────────────────────────────────────
#  LostLink — Resilient Nginx Load Balancer with Cloud Bursting
#  Assignment 3: Questions 1(a), 1(b), 1(c), and Question 1(d)
#
#  Features:
#    • Primary 3-tier round-robin cluster (backend1, backend2, backend3)
#    • Elastic Cloud Bursting node (backend-burst) for peak load absorption
#    • Threshold-based & header-aware dynamic routing
#    • Zero-Downtime High Availability & Automated Fallback
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream: Primary Baseline Cluster (3 Nodes) ──────────────────────────────
upstream lostlink_primary {
    server backend1:5000 max_fails=3 fail_timeout=15s;
    server backend2:5000 max_fails=3 fail_timeout=15s;
    server backend3:5000 max_fails=3 fail_timeout=15s;

    # Cloud Bursting backup: Activated automatically if primary nodes are saturated or down
    server backend-burst:5000 max_fails=3 fail_timeout=15s backup;
}

# ── Upstream: Dedicated Cloud Bursting Node ───────────────────────────────────
upstream lostlink_burst {
    # Active burst container (simulating elastic cloud instance)
    server backend-burst:5000 max_fails=3 fail_timeout=15s;

    # Graceful fallback: If burst container is stopped, route back to primary nodes
    server backend1:5000 backup;
    server backend2:5000 backup;
    server backend3:5000 backup;
}

# ── Upstream: Unified 4-Node Elastic Cluster ───────────────────────────────────
upstream lostlink_elastic {
    server backend1:5000 max_fails=3 fail_timeout=15s;
    server backend2:5000 max_fails=3 fail_timeout=15s;
    server backend3:5000 max_fails=3 fail_timeout=15s;
    server backend-burst:5000 max_fails=3 fail_timeout=15s;
}

# Backward-compatibility alias for baseline tests
upstream lostlink_backend {
    server backend1:5000 max_fails=3 fail_timeout=15s;
    server backend2:5000 max_fails=3 fail_timeout=15s;
    server backend3:5000 max_fails=3 fail_timeout=15s;
    server backend-burst:5000 max_fails=3 fail_timeout=15s backup;
}

# ── Dynamic Upstream Selection Map ────────────────────────────────────────────
# Evaluates request headers / burst trigger:
#   • Default (no header or "false"): Routes to lostlink_primary (backend1-3)
#   • "true" / "1" / "burst": Routes overflow traffic to lostlink_burst (backend-burst)
#   • "all" / "elastic": Routes across all 4 nodes
map $http_x_lostlink_burst $backend_upstream {
    default lostlink_primary;
    "true"   lostlink_burst;
    "1"      lostlink_burst;
    "burst"  lostlink_burst;
    "all"    lostlink_elastic;
}

server {
    listen 80;
    listen [::]:80;

    # Timeouts for upstream connections
    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # Main application routing (Dynamic upstream selection)
    location / {
        proxy_pass http://$backend_upstream;

        # Forward real client information to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Fault-Tolerant Failover Policy ───────────────────────────────────
        # When an instance crashes, stops, or returns 500/502/503/504, Nginx
        # immediately reroutes the pending request to the next available backend
        # in the upstream group without returning any error to the user.
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Keepalive upstream optimization
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # Dedicated burst path: explicit route to burst tier with automated fallback
    location /burst/ {
        rewrite ^/burst/(.*)$ /$1 break;
        proxy_pass http://lostlink_burst;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
}
