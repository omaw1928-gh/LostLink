# ─────────────────────────────────────────────────────────────────────────────
#  LostLink — Nginx Load Balancer Baseline (Without Automatic Failover)
#  Assignment 3, Question 1(c) — BEFORE Configuration
#
#  In this configuration, when a backend instance is terminated during load,
#  Nginx does NOT retry the failed connection on another backend.
#  This results in connection drops and HTTP 502 Bad Gateway errors.
# ─────────────────────────────────────────────────────────────────────────────

upstream lostlink_backend {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
}

server {
    listen 80;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    location / {
        proxy_pass http://lostlink_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable automated retries to demonstrate failure
        proxy_next_upstream off;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
}
