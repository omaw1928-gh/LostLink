# ─────────────────────────────────────────────────────────────────────────────
#  LostLink — Docker Compose
#  Assignment 3, Question 1(a):
#    • Three Express backend instances (backend1, backend2, backend3)
#    • Nginx load balancer (round-robin) exposed on host port 8080
#
#  Quick Start:
#    1. Copy backend/.env.example to backend/.env and fill in real values.
#    2. docker compose up --build
#    3. Open http://localhost:8080/api/health
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend Instance 1 ──────────────────────────────────────────────────────
  backend1:
    build:
      context: ./backend          # Dockerfile lives in ./backend/
      dockerfile: Dockerfile
    image: lostlink-backend       # Shared image tag (all three use the same build)
    container_name: lostlink-backend1
    restart: unless-stopped       # Restart if the process crashes, but not on manual stop
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend1      # Unique label — appears in X-LostLink-Instance header
      # ── Secrets: read from .env in the repo root (never hardcoded here) ──
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLIENT_URL=${CLIENT_URL:-https://lost-link-ten.vercel.app}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-c8f1e29d7a4b6c3e1f0a5b8d2e4c7a9b0e1f3a5c7d9b2e4f6a8c0d2e4f6a8b0c}
    # Backend ports are NOT exposed to the host — only Nginx can reach them
    # (they communicate on the internal Docker network).
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s            # Give Node.js time to connect to MongoDB Atlas

  # ── Backend Instance 2 ──────────────────────────────────────────────────────
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lostlink-backend
    container_name: lostlink-backend2
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend2
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLIENT_URL=${CLIENT_URL:-https://lost-link-ten.vercel.app}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-c8f1e29d7a4b6c3e1f0a5b8d2e4c7a9b0e1f3a5c7d9b2e4f6a8c0d2e4f6a8b0c}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Backend Instance 3 ──────────────────────────────────────────────────────
  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lostlink-backend
    container_name: lostlink-backend3
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend3
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLIENT_URL=${CLIENT_URL:-https://lost-link-ten.vercel.app}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-c8f1e29d7a4b6c3e1f0a5b8d2e4c7a9b0e1f3a5c7d9b2e4f6a8c0d2e4f6a8b0c}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Cloud Bursting Instance (Elastic Burst Capacity for Q1(d)) ───────────
  backend-burst:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lostlink-backend
    container_name: lostlink-backend-burst
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend-burst      # Distinct instance label for burst traffic
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLIENT_URL=${CLIENT_URL:-https://lost-link-ten.vercel.app}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-c8f1e29d7a4b6c3e1f0a5b8d2e4c7a9b0e1f3a5c7d9b2e4f6a8c0d2e4f6a8b0c}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Nginx Load Balancer ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine      # Official Alpine-based Nginx — tiny and up-to-date
    container_name: lostlink-nginx
    restart: unless-stopped
    ports:
      - "8080:80"                 # Host port 8080 → container port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Containerized MongoDB Failover Service ────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: lostlink-mongo
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:

